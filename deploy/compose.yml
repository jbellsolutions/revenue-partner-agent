services:
  revenue-partner:
    image: nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
    container_name: revenue-partner
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - ${REVENUE_PARTNER_DATA_DIR:-/srv/revenue-partner/data}:/opt/data
    ports:
      - "127.0.0.1:${HERMES_PORT:-8642}:8642"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${HERMES_MEM_LIMIT:-5g}
    cpus: ${HERMES_CPUS:-3.0}
