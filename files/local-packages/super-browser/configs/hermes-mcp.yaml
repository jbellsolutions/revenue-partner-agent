# Locked Revenue Partner image: local Super Browser stdio MCP only.
# Hosted/autonomous provider MCPs and credential setup are intentionally absent.
# Changes require a separately reviewed image rebuild.
mcp_servers:
  super-browser:
    command: /usr/local/bin/super-browser-server
    args: []
    cwd: /root/.hermes/local-packages/super-browser
    env:
      SUPER_BROWSER_REPO_ROOT: /root/.hermes/local-packages/super-browser
      SUPER_BROWSER_STATE_DIR: /root/.super-browser
    enabled: true
    connect_timeout: 30.0
    tool_timeout: 300.0
